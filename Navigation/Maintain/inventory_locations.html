<div id="locationsMaintenanceContainer" data-module="Inventory Locations" style="width: 700px; height: 320px; background: white; display: flex; flex-direction: column; padding: 0px 15px 15px 15px; font-family: 'Segoe UI', sans-serif; border-radius: 8px;">
    
    <!-- Top Row: Buttons (Right) -->
    <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; gap: 6px; border-bottom: 2px solid var(--theme-primary, #1F4E79); padding-bottom: 5px; width: 100%; justify-content: flex-end;">
            <button class="ob-btn" onclick="resetLocationForm(true)">Add<br>New</button>
            <button class="ob-btn" onclick="saveLocationMaint()">Save<br>(Ctrl+S)</button>
            <button class="ob-btn ob-delete" onclick="deleteLocationMaint()">Delete</button>
            <button class="ob-btn" onclick="resetLocationForm(false)">Cancel</button>
        </div>
    </div>

    <!-- Bottom Row: List (Left) and Input (Right) -->
    <div style="display: flex; gap: 20px; flex: 1;">
        <!-- Location Navigation Listbox -->
        <div style="width: 300px; display: flex; flex-direction: column;">
            <select id="locationMaintList" size="2" 
                    style="width: 100%; height: 100%; border: 1px solid black; outline: none; border-radius: 4px; font-size: 13px; background: #fff;" 
                    onchange="onLocationMaintSelect(this.value)">
            </select>
        </div>
        
        <!-- Location Input Area -->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 15px; margin-top: 5px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 13px; font-weight: 700; color: #1F4E79; font-style: italic; width: 120px;">Location Name</label>
                <input type="text" id="locationMaintName" autocomplete="off" 
                       style="flex: 1; height: 28px; border: 1px solid black; outline: none; padding: 0 8px; font-size: 13px;" 
                       disabled placeholder="Select or click Add New...">
            </div>

            <div style="display: flex; align-items: flex-start; gap: 10px; flex: 1;">
                <label style="font-size: 13px; font-weight: 700; color: #1F4E79; font-style: italic; width: 120px; margin-top: 4px;">Description</label>
                <textarea id="locationMaintDesc" 
                          style="flex: 1; height: 100%; border: 1px solid black; outline: none; padding: 8px; font-size: 13px; resize: none; font-family: inherit;" 
                          disabled></textarea>
            </div>
        </div>
    </div>

    <style>
        .ob-btn {
            background: #4a789c;
            border: 1px solid #4a789c;
            padding: 2px;
            font-size: 11px;
            line-height: 1.2;
            letter-spacing: -0.2px;
            text-align: center;
            white-space: normal;
            font-weight: 600;
            cursor: pointer;
            width: 50px;
            height: 35px;
            border-radius: 4px;
            color: white !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .ob-btn:hover { background: #3b6282; }
        .ob-delete { background: #dc3545 !important; border-color: #dc3545 !important; }
        .ob-delete:hover { background: #c82333 !important; }
        
        #locationMaintList option { padding: 2px 8px; font-size: 12px; border-bottom: 1px solid #f1f5f9; }
        #locationMaintList option:checked { 
            background: var(--theme-primary, #1F4E79) !important; 
            color: white !important; 
            box-shadow: 0 0 10px 100px var(--theme-primary, #1F4E79) inset !important; -webkit-box-shadow: 0 0 10px 100px var(--theme-primary, #1F4E79) inset !important;
        }
        #locationMaintList::-webkit-scrollbar {
            display: none;
        }
        #locationMaintList {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* CSS to hide outer scrollbar but allow inner scroll if needed */
        #locationsMaintenanceContainer {
            overflow: hidden !important;
        }
    </style>
    
    <script>
        // Make parent modal wider and remove any outer scrollbar
        setTimeout(() => {
            const container = document.getElementById('locationsMaintenanceContainer');
            if(container) {
                const modal = container.closest('.modal-container');
                if(modal) {
                    modal.style.maxWidth = '900px';
                    modal.style.width = '900px';
                    
                    const modalBody = modal.querySelector('.modal-body');
                    if (modalBody) {
                        modalBody.style.overflow = 'hidden';
                        modalBody.style.padding = '0'; // Remove extra padding that might cause scroll
                    }
                }
            }
        }, 50);
    </script>
</div>
