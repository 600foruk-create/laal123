<div id="itemPriceSettingsContainer" data-module="Item Price Settings" style="width: 920px; height: 640px; margin: 5px; background: white; display: flex; flex-direction: column; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; box-sizing: border-box; border: 1px solid #cbd5e0; border-radius: 4px;">
    
    <!-- Header Section -->
    <div style="background: #f8fafc; padding: 10px 15px; border-bottom: 1px solid #e2e8f0; position: relative; display: flex; align-items: center; justify-content: space-between; margin: 0; border: 1px solid #e2e8f0; border-radius: 4px;">
        
        <!-- Left: Empty -->
        <div style="width: 10px;"></div>

        <!-- Middle: Options -->
        <div style="flex: 1; margin-left: 40px; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 15px;">
                <label style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #334155; cursor: pointer;">
                    <input type="radio" name="priceFilter" value="all" checked onchange="window.PriceSettingsModule.toggleFilters()"> All Inventory Items
                </label>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #334155; width: 100px; cursor: pointer;">
                    <input type="radio" name="priceFilter" value="category" onchange="window.PriceSettingsModule.toggleFilters()"> Category
                </label>
                <div class="custom-dropdown-container" id="catDropdownContainer">
                    <div class="custom-dropdown-display disabled" id="priceCategoryDisplay" tabindex="0" onclick="window.PriceSettingsModule.toggleDropdown('catList', this)" onkeydown="window.PriceSettingsModule.handleDropdownKeydown(event, 'catList', 'category', this)">
                        <span id="priceCategoryText" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Select Category...</span>
                        <i class="fas fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i>
                    </div>
                    <div class="custom-dropdown-list" id="catList"></div>
                    <input type="hidden" id="priceCategorySelect" value="0">
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #334155; width: 100px; cursor: pointer;">
                    <input type="radio" name="priceFilter" value="brand" onchange="window.PriceSettingsModule.toggleFilters()"> Brand
                </label>
                <div class="custom-dropdown-container" id="brandDropdownContainer">
                    <div class="custom-dropdown-display disabled" id="priceBrandDisplay" tabindex="0" onclick="window.PriceSettingsModule.toggleDropdown('brandList', this)" onkeydown="window.PriceSettingsModule.handleDropdownKeydown(event, 'brandList', 'brand', this)">
                        <span id="priceBrandText" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Select Brand...</span>
                        <i class="fas fa-chevron-down" style="font-size: 10px; margin-left: 5px;"></i>
                    </div>
                    <div class="custom-dropdown-list" id="brandList"></div>
                    <input type="hidden" id="priceBrandSelect" value="0">
                </div>
            </div>
        </div>

        <!-- Right: Top Buttons & Margin Box -->
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px;">
            <div style="display: flex; gap: 6px; border-bottom: 2px solid var(--theme-primary, #1F4E79); padding-bottom: 5px;">
                <button class="ob-btn" onclick="window.PriceSettingsModule.save()">Save<br>(Ctrl+S)</button>
                <button class="ob-btn" onclick="window.PriceSettingsModule.cancel()">Cancel</button>
            </div>
            
            <div style="background: #cbd5e0; padding: 5px 10px; border: 1px solid #94a3b8; display: flex; align-items: center; gap: 5px; border-radius: 2px;">
                <span style="font-size: 12px; font-weight: 600; color: #1e293b;">Set</span>
                <input type="number" id="profitMarginInput" style="width: 50px; height: 22px; text-align: center; border: 1px solid #94a3b8; font-weight: 700;" value="0">
                <span style="font-size: 11px; font-weight: 600; color: #1e293b;">% Profit Margin on Purchase Price of all Items.</span>
                <button style="height: 22px; padding: 0 10px; font-size: 11px; font-weight: 700; background: #f1f5f9; border: 1px solid #94a3b8; cursor: pointer;" onclick="window.PriceSettingsModule.applyMargin()">Update</button>
            </div>
        </div>
    </div>

    <!-- Table Section -->
    <div style="flex: 1; background: white; margin: 5px 0 0 0; border: 1px solid #e2e8f0; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column;">
        <div style="overflow-y: auto; flex: 1;">
            <table style="width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed;">
                <thead style="position: sticky; top: 0; background: #f8fafc; z-index: 10;">
                    <tr>
                        <th style="width: 40px; border-bottom: 2px solid #e2e8f0; border-right: 1px solid #e2e8f0; padding: 4px;"></th>
                        <th style="width: 120px; border-bottom: 2px solid #e2e8f0; border-right: 1px solid #e2e8f0; padding: 4px; color: #475569; font-size: 11px; font-weight: 700; text-transform: uppercase; text-align: center;">Item Code</th>
                        <th style="border-bottom: 2px solid #e2e8f0; border-right: 1px solid #e2e8f0; padding: 4px; color: #475569; font-size: 11px; font-weight: 700; text-transform: uppercase; text-align: left;">Item Name</th>
                        <th style="width: 80px; border-bottom: 2px solid #e2e8f0; border-right: 1px solid #e2e8f0; padding: 4px; color: #475569; font-size: 11px; font-weight: 700; text-transform: uppercase; text-align: center;">Unit</th>
                        <th style="width: 150px; border-bottom: 2px solid #e2e8f0; border-right: 1px solid #e2e8f0; padding: 4px; color: #475569; font-size: 11px; font-weight: 700; text-transform: uppercase; text-align: center;">Purchase Price</th>
                        <th style="width: 150px; border-bottom: 2px solid #e2e8f0; padding: 4px; color: #475569; font-size: 11px; font-weight: 700; text-transform: uppercase; text-align: center;">Selling Price</th>
                    </tr>
                </thead>
                <tbody id="priceSettingsTableBody">
                    <!-- Data Rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <style>
        .ob-btn {
            background: #4a789c;
            border: 1px solid #4a789c;
            padding: 2px;
            font-size: 11px;
            line-height: 1.2;
            letter-spacing: -0.2px;
            text-align: center;
            white-space: normal;
            font-weight: 600;
            cursor: pointer;
            width: 50px;
            height: 35px;
            border-radius: 4px;
            color: white !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .ob-btn:hover { background: #3b6282; }

        .price-input-cell {
            box-sizing: border-box;
            width: 100%;
            height: 18px;
            border: 1px solid transparent;
            text-align: right;
            font-weight: 600;
            padding: 0px 4px;
            outline: none;
            background: transparent;
            font-size: 13px;
            -moz-appearance: textfield;
        }
        .price-input-cell::-webkit-inner-spin-button,
        .price-input-cell::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .price-input-cell:focus { 
            background: #fff;
            border: 1px solid #cbd5e0;
        }
        
        #priceSettingsTableBody tr { 
            height: 20px;
            cursor: pointer;
        }
        #priceSettingsTableBody tr:hover { background: #edf2f7; }
        #priceSettingsTableBody tr.row-selected { background: var(--theme-primary, #1F4E79) !important; color: white !important; }
        #priceSettingsTableBody tr.row-selected td { color: white !important; }
        #priceSettingsTableBody tr.row-selected .price-input-cell { color: white; background: transparent; }
        #priceSettingsTableBody tr.row-selected .price-input-cell:focus { background: #fff; color: #333; }
        #priceSettingsTableBody tr .row-arrow { visibility: hidden; }
        #priceSettingsTableBody tr.row-selected .row-arrow { visibility: visible; color: white; }
        #priceSettingsTableBody td { 
            padding: 0 4px; 
            border-bottom: 1px solid #cbd5e0; 
            border-right: 1px solid #cbd5e0; 
            font-size: 13px;
            height: 20px;
            box-sizing: border-box;
        }
        .custom-dropdown-container {
            position: relative;
            flex: 1;
            max-width: 300px;
            height: 22px;
            font-size: 13px;
        }
        .custom-dropdown-display {
            border: 1px solid black;
            background: #fff;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 5px;
            cursor: pointer;
            justify-content: space-between;
            color: #333;
        }
        .custom-dropdown-display:focus {
            outline: 2px solid #1F4E79;
            outline-offset: -1px;
        }
        .custom-dropdown-display.disabled {
            background: #f8f9fa;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: black;
        }
        .custom-dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #cbd5e0;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .custom-dropdown-item {
            padding: 2px 5px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }
        .custom-dropdown-item:hover, .custom-dropdown-item.selected {
            background: #1F4E79;
            color: white;
        }
    </style>

</div>
