<div id="buyerTypeMaintenanceContainer" data-module="Buyer Types" style="width: 760px; max-width: 100%; height: 350px; background: white; display: flex; flex-direction: column; padding: 4px 16px 14px 16px; font-family: 'Segoe UI', sans-serif; box-sizing: border-box; border-radius: 6px;">
    
    <!-- Top Row: Buttons (Right) -->
    <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 12px;">
        <div style="display: flex; gap: 6px; border-bottom: 2px solid var(--theme-primary, #1F4E79); padding-bottom: 5px; width: 100%; justify-content: flex-end;">
            <button class="ob-btn" onclick="resetBuyerTypeForm(true)">Add<br>New</button>
            <button class="ob-btn" onclick="saveBuyerType()">Save<br>(Ctrl+S)</button>
            <button class="ob-btn ob-delete" onclick="deleteBuyerType()">Delete</button>
            <button class="ob-btn" onclick="resetBuyerTypeForm(false)">Cancel</button>
        </div>
    </div>

    <!-- Bottom Row: List (Left) and Input (Right) -->
    <div style="display: flex; gap: 18px; flex: 1;">
        <!-- Buyer Types Navigation Listbox -->
        <div style="width: 260px; display: flex; flex-direction: column;">
            <label style="font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase;">Buyer Types List</label>
            <select id="buyerTypeList" size="2" style="width: 100%; height: 100%; border: 1px solid black; outline: none; border-radius: 4px; font-size: 13px; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.2);" onchange="onBuyerTypeSelect(this.value)" onclick="if(this.value) onBuyerTypeSelect(this.value)"></select>
        </div>
        
        <!-- Input Area -->
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 10px; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                <label style="font-size: 13px; font-weight: 600; font-style: italic; color: #475569; white-space: nowrap; width: 130px; text-align: right;">Buyer Type Name</label>
                <input type="text" id="buyerTypeName" autocomplete="off" placeholder="e.g. Registered Person / Filer" style="flex: 1; height: 30px; border: 1px solid black; outline: none; padding: 0 10px; font-size: 13px; border-radius: 4px; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.05);" disabled>
            </div>

            <input type="hidden" id="buyerTypeCode" value="Registered">

            <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                <label style="font-size: 13px; font-weight: 600; font-style: italic; color: #475569; white-space: nowrap; width: 130px; text-align: right;">Sales Tax Rate (%)</label>
                <input type="number" step="0.01" id="buyerTypeSalesTax" placeholder="18.00" autocomplete="off" style="flex: 1; height: 30px; border: 1px solid black; outline: none; padding: 0 10px; font-size: 13px; border-radius: 4px; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.05);" disabled>
            </div>

            <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                <label style="font-size: 13px; font-weight: 600; font-style: italic; color: #475569; white-space: nowrap; width: 130px; text-align: right;">Further Tax Rate (%)</label>
                <input type="number" step="0.01" id="buyerTypeFurtherTax" placeholder="0.00 (4.00 for Unregistered)" autocomplete="off" style="flex: 1; height: 30px; border: 1px solid black; outline: none; padding: 0 10px; font-size: 13px; border-radius: 4px; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.05);" disabled>
            </div>

            <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                <label style="font-size: 13px; font-weight: 600; font-style: italic; color: #475569; white-space: nowrap; width: 130px; text-align: right;">Extra Tax Rate (%)</label>
                <input type="number" step="0.01" id="buyerTypeExtraTax" placeholder="0.00" autocomplete="off" style="flex: 1; height: 30px; border: 1px solid black; outline: none; padding: 0 10px; font-size: 13px; border-radius: 4px; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.05);" disabled>
            </div>

            <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                <label style="font-size: 13px; font-weight: 600; font-style: italic; color: #475569; white-space: nowrap; width: 130px; text-align: right;">Description</label>
                <input type="text" id="buyerTypeDesc" placeholder="Optional notes" autocomplete="off" style="flex: 1; height: 30px; border: 1px solid black; outline: none; padding: 0 10px; font-size: 13px; border-radius: 4px; box-shadow: inset 1px 1px 2px rgba(0,0,0,0.05);" disabled>
            </div>
        </div>
    </div>

    <style>
        #buyerTypeMaintenanceContainer .ob-btn {
            background: #4a789c;
            border: 1px solid #4a789c;
            padding: 2px;
            font-size: 11px;
            line-height: 1.2;
            letter-spacing: -0.2px;
            text-align: center;
            white-space: normal;
            font-weight: 600;
            cursor: pointer;
            width: 50px;
            height: 35px;
            border-radius: 4px;
            color: white !important;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #buyerTypeMaintenanceContainer .ob-btn:hover { background: #3b6282; }
        #buyerTypeMaintenanceContainer .ob-delete { background: #dc3545 !important; border-color: #dc3545 !important; }
        #buyerTypeMaintenanceContainer .ob-delete:hover { background: #c82333 !important; }
        
        #buyerTypeList option { padding: 4px 8px; font-size: 12.5px; border-bottom: 1px solid #f1f5f9; }
        #buyerTypeList option:checked { 
            background: var(--theme-primary, #1F4E79) !important; 
            color: white !important; 
            box-shadow: 0 0 10px 100px var(--theme-primary, #1F4E79) inset !important; -webkit-box-shadow: 0 0 10px 100px var(--theme-primary, #1F4E79) inset !important;
        }
        #buyerTypeList::-webkit-scrollbar {
            display: none;
        }
        #buyerTypeList {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        #buyerTypeMaintenanceContainer {
            overflow: hidden !important;
        }
    </style>

    <img src="x" onerror="
        setTimeout(() => {
            if (typeof window.fetchBuyerTypes === 'function') {
                window.fetchBuyerTypes();
            }
        }, 50);
    " style="display:none;">
</div>
