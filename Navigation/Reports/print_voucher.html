<div style="padding: 20px; background-color: white; height: 100%; overflow-y: auto; font-family: 'Segoe UI', Tahoma, sans-serif; border-radius: 4px;">
    
    <!-- Header Controls -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">
        <h2 style="margin: 0; font-size: 24px; font-weight: bold; color: #1F4E79;">Print Vouchers</h2>
        <button onclick="window.PrintVoucherModule.executePrint()" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; height: 50px; background: #fff; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
            <i class="fas fa-print" style="font-size: 20px; color: #1F4E79; margin-bottom: 3px;"></i>
            <span style="font-size: 11px; font-weight: bold; color: #333;">Print</span>
        </button>
    </div>

    <!-- Voucher Type Section -->
    <fieldset style="border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 20px; background-color: #f8f9fa; border-radius: 4px;">
        <legend style="font-weight: bold; font-size: 14px; padding: 0 5px; color: #1F4E79;">Voucher Type</legend>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px;">
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="purchases" checked> Purchase Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="purchase_returns"> Purchase Return Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="sale_invoices"> Sale Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="sale_returns"> Sale Return Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="bank_receipts"> Bank Receipt Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="bank_payments"> Bank Payment Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="cash_receipts"> Cash Receipt Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="cash_payments"> Cash Payment Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="material_issue_notes"> Material Issue Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="production_notes"> Production Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="add_inventory_adjustments"> Add Inventory Adjustment Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="reduce_inventory_adjustments"> Reduce Inventory Adjustment Vouchers
            </label>
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_type" value="general_journal_voucher"> General Journal Vouchers
            </label>
        </div>
    </fieldset>

    <!-- Selection Criteria Section -->
    <fieldset style="border: 1px solid #e2e8f0; padding: 15px; background-color: #f8f9fa; border-radius: 4px;">
        <legend style="font-weight: bold; font-size: 14px; padding: 0 5px; color: #1F4E79;">Selection Criteria</legend>
        
        <div style="display: flex; flex-direction: column; gap: 12px; font-size: 13px;">
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <input type="radio" name="pv_criteria" value="all" onchange="window.PrintVoucherModule.toggleCriteria()" checked> All Records
            </label>
            
            <div style="display: flex; align-items: center; gap: 15px;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100px;">
                    <input type="radio" name="pv_criteria" value="date" onchange="window.PrintVoucherModule.toggleCriteria()"> Date From
                </label>
                <input type="date" id="pv_date_from" disabled style="border: 1px solid #aaa; padding: 2px 5px; width: 130px; font-size: 12px;">
                <span style="font-weight: bold;">To</span>
                <input type="date" id="pv_date_to" disabled style="border: 1px solid #aaa; padding: 2px 5px; width: 130px; font-size: 12px;">
            </div>
            
            <div style="display: flex; align-items: center; gap: 15px;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100px;">
                    <input type="radio" name="pv_criteria" value="serial" onchange="window.PrintVoucherModule.toggleCriteria()"> Serial From
                </label>
                <input type="number" id="pv_serial_from" disabled style="border: 1px solid #aaa; padding: 2px 5px; width: 130px; font-size: 12px;">
                <span style="font-weight: bold;">To</span>
                <input type="number" id="pv_serial_to" disabled style="border: 1px solid #aaa; padding: 2px 5px; width: 130px; font-size: 12px;">
            </div>
        </div>
    </fieldset>
    
</div>
<script>
    if (window.PrintVoucherModule) {
        window.PrintVoucherModule.init();
    }
</script>
